version: 2
updates:
  - package-ecosystem: "maven"
    # basex-tests and basex-examples are not modules of the root POM
    directories:
      - "/"
      - "/basex-tests"
      - "/basex-examples"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # minor and patch updates in one PR; major updates stay separate
    groups:
      maven:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # hosted on files.basex.org, which Dependabot cannot reach
      - dependency-name: "net.xqj:basex-xqj"
      - dependency-name: "org.apache:lucene-stemmers"
      - dependency-name: "jp.sourceforge.igo:igo"
      # GeoSolutions lists customer builds (C105.*, *-EOWS-*); bumped by hand with geotools.version
      - dependency-name: "org.geotools:gt-epsg-hsql"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
