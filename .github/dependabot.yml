version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # hosted on files.basex.org, which Dependabot cannot reach
      - dependency-name: "net.xqj:basex-xqj"
      - dependency-name: "org.apache:lucene-stemmers"
      - dependency-name: "jp.sourceforge.igo:igo"
