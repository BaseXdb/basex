name: Build and Test BaseX

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # minimum release and current LTS
        java: [ '21', '25' ]

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Set up Java
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      # Build and test all modules listed in the root pom.xml (core, api, modules incl. geo/mail/sftp)
      - name: Build with Maven
        run: mvn -B clean install

      # Build the remaining subprojects (compile-only)
      - name: Build examples and tests without running them
        run: |
          mvn -B -DskipTests package -f basex-examples/pom.xml
          mvn -B -DskipTests package -f basex-tests/pom.xml

      # Archive test reports and possible dumps in case of failure or timeout
      # (a timeout cancels the job, which failure() alone does not cover)
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-java${{ matrix.java }}
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
            **/*.dump
            **/*.dumpstream
