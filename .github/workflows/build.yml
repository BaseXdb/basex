name: Build and Test BaseX

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # minimum release and current LTS
        java: [ '21', '25' ]

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Set up Java
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # Restore dependencies (saved below even on failure; setup-java caches only on success)
      - name: Restore Maven repository
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # Build and test all modules listed in the root pom.xml (core, api, modules incl. geo/mail/sftp)
      - name: Build with Maven
        run: mvn -B clean install

      # Build the remaining subprojects (compile-only)
      - name: Build examples and tests without running them
        run: |
          mvn -B -DskipTests package -f basex-examples/pom.xml
          mvn -B -DskipTests package -f basex-tests/pom.xml

      # Save dependencies on a cache miss, without the artifacts built here
      - name: Remove built artifacts from Maven repository
        if: always() && steps.maven-cache.outputs.cache-hit != 'true'
        run: rm -rf ~/.m2/repository/org/basex
      - name: Save Maven repository
        if: always() && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      # Archive test reports and possible dumps in case of failure or timeout
      # (a timeout cancels the job, which failure() alone does not cover)
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-java${{ matrix.java }}
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
            **/*.dump
            **/*.dumpstream
