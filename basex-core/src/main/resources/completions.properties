# This property file specifies code completions for the GUI editor.
#
# The string specified as key will be replaced with the assigned value.
# The key spells the completed construct, with hyphens, but without spaces.
# A vertical bar in the value specifies where the cursor will be located.
# A tilde is replaced with the namespace prefix of a library module (empty in main modules).
#
# Values that start with 'declare' are also proposed as continuations of a prolog declaration.

ancestor=ancestor::
ancestor-or-self=ancestor-or-self::
base-uri=declare base-uri '|';
boundary-space=declare boundary-space |;
child=child::
construction=declare construction |;
contextvalue=declare context value := |;
copy=copy $| := \nmodify \nreturn
copy-namespaces=declare copy-namespaces |, inherit;
decimal-format=declare decimal-format |;
defaultcollation=declare default collation '|';
defaultdecimalformat=declare default decimal-format |;
defaultelement=declare default element namespace '|';
defaultfunction=declare default function namespace '|';
defaultorder=declare default order empty |;
deletenodes=delete nodes |
descendant=descendant::
descendant-or-self=descendant-or-self::
every=every $| in \nsatisfies
following=following::
following-sibling=following-sibling::
for=for $| in \nreturn
function=declare function ~|() {};
if=if (|) then \nelse
import=import module namespace | = '';
insertnodes=insert nodes | into
let=let $| := \nreturn
module=module namespace | = '';
namespace=declare namespace | = '';
option=declare option | '';
optionoutput=declare option output:| '';
ordering=declare ordering |;
parent=parent::
preceding=preceding::
preceding-sibling=preceding-sibling::
record=declare record ~|();
renamenodes=rename nodes | as
replacenodes=replace nodes | with
replacevalue=replace value of nodes | with
revalidation=declare revalidation skip;
self=self::
sliding=for sliding window | in \nstart when \nreturn
some=some $| in \nsatisfies
switch=switch (|) {\n  case  return \n  default return \n}
try=try {|} catch * {}
tumbling=for tumbling window | in \nstart when \nreturn
typeswitch=typeswitch (|) {\n  case  return \n  default return \n}
update=update {|}
variable=declare variable $~| := ;
